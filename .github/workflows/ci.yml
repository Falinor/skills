name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # For the syntax-identical proof tests; the tool itself never installs it.
      - name: Install difftastic
        env:
          DIFFT_VERSION: 0.71.0
        run: |
          mkdir -p "$RUNNER_TEMP/difft"
          curl -fsSL "https://github.com/Wilfred/difftastic/releases/download/${DIFFT_VERSION}/difft-${DIFFT_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/difft" difft
          echo "$RUNNER_TEMP/difft" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/difft/difft" --version
      - run: npm run test:cli
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:page
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
